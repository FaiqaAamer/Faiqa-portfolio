<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 3</title>
  <style>
    body {
      margin: 0;
      font-family: 'Papyrus', 'Georgia', serif;
      background: transparent;
    }

    .page-bg {
      position: relative;
      width: 100%;
      height: 100%;
      background: url("small_page.png") no-repeat center/cover;
    }

    .title {
      position: absolute;
      top: 380px;
      left: 20px;
      font-size: 25px;
      font-style: italic;
      color: #5a3e2b;
      transform: rotate(-5deg);
      z-index: 3;
    }

    /* pinned paper */
    .paper {
      position: absolute;
      top: 240px;
      left: 120px;
      width: 220px;
      transform: rotate(-7deg);
      opacity: 0.95;
      z-index: 2;
    }

    /* text written on the paper */
    .stack-text {
      position: absolute;
      top: 300px;
      left: 170px;
      font-size: 14px;
      color: #3e2e1f;
      line-height: 1.8;
      transform: rotate(-7deg);
      z-index: 3;
    }

    .corner {
  position: absolute;
  bottom: -50px;     /* adjust vertical position */
  right: -55px;      /* adjust horizontal position */
  width: 330px;      /* size of the corner image */
  opacity: 0.95;    /* soft blend */
  z-index: 1;       /* above paper and text */
}

.star {
  position: absolute;
  top: 230px;     /* adjust vertical position */
  left: 5px;      
  width: 150px;   
  opacity: 0.95;    /* soft blend */
  z-index: 10;       /* above paper and text */
  animation: rotateStar 2s infinite ease-in-out;
}

@keyframes rotateStar {
  0%   { transform: rotate(5deg); }
  50%  { transform: rotate(-5deg); }
  100% { transform: rotate(5deg); }
}

.features-title {
  position: absolute;
  top: 110px;       /* place above sticky note */
  left: 260px;       /* align with sticky note */
  font-size: 25px;
  font-style: italic;
  color: #5a3e2b;
  transform: rotate(3deg);
  z-index: 3;
}

.features-note {
  position: absolute;
  top: 40px;      
  left: 20px;       
  width: 250px;     
  transform: rotate(3deg);
  opacity: 0.95;
  z-index: 2;
}

.features-text {
  position: absolute;
  top: 70px;
  left: 60px;
  width: 200px;
  font-size: 13px;
  color: #3e2e1f;
  line-height: 1.6;
  transform: rotate(3deg);
  z-index: 3;
}

  </style>
</head>
<body>
  <img src="corner.png" alt="Corner Decoration" class="corner">
  <img src="stars.png" alt="Corner Decoration" class="star">
  <div class="page-bg">
  <h2 class="title">Tech Stack</h2>
  <img src="small_paper.png" alt="Pinned Paper" class="paper">
  <div class="stack-text">
    <p>● HTML</p>
    <p>● CSS</p>
    <p>● JavaScript</p>
    <p>● React</p>
    <p>● Vite</p>
  </div> 

  <h2 class="features-title">Features</h2>
  <img src="sticky.png" alt="Sticky Note Decoration" class="features-note">
  <div class="features-text">
    <p>● Notebook Management</p>
    <p>● Notes Editor</p>
    <p>● Sticky Notes Board</p>
    <p>● Dark mode and Import/Export</p>
  </div>
</div>

</body>
</html>
